name: codex
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codex/native/package-lock.json
      - run: npm --prefix codex/native ci --ignore-scripts
      - run: npm --prefix codex/native run build
      - run: npm --prefix codex/native test
      - run: npm --prefix codex/cloud run build
      - run: npm --prefix codex/cloud test
      - run: node codex/panel/test.mjs
      - run: node codex/panel/http-test.mjs
