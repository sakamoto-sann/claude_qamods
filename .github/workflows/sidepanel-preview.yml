name: sidepanel-preview
on:
  pull_request:
    paths: ['codex/sidepanel-prototype/**', '.github/workflows/sidepanel-preview.yml']
  push:
    branches: [main]
    paths: ['codex/sidepanel-prototype/**', '.github/workflows/sidepanel-preview.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix codex/native ci --ignore-scripts
      - run: node codex/sidepanel-prototype/build-native.mjs
      - run: node codex/sidepanel-prototype/check-native.mjs
      - run: python3 -m compileall -q codex/sidepanel-prototype
