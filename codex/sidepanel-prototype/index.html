<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Guide · サイドパネル試作</title>
<style>html,body{margin:0;height:100%;font:13px -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f7f8fa;color:#283441}body{display:flex;flex-direction:column}*{box-sizing:border-box}header{padding:14px 16px;background:#fff;border-bottom:1px solid #dde3e9}h1{font-size:15px;margin:0 0 7px}p{margin:8px 0;line-height:1.7}small{color:#657587}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}button{font:inherit;cursor:pointer;border:1px solid #d0dbe3;border-radius:7px;background:#fff;padding:7px 11px;color:inherit}button[aria-pressed=true]{background:#e9f0f5;border-color:#52748c}#stage{flex:1;min-height:0;display:flex;justify-content:center}iframe{display:block;width:100%;height:100%;border:0;background:#f7f8fa}#status{font-size:11px;min-height:20px;color:#657587}[hidden]{display:none!important}</style>
<header><h1>QA Guide <small>サイドパネル試作</small></h1><p>現行版を変更しない、独立した表示用の試作です。</p><nav aria-label="表示の試験"><button id="narrow" aria-pressed="false">幅360px</button><button id="wide" aria-pressed="true">パネル幅</button><button id="reload">サンプルを再表示</button><button id="toggle">パネルを閉じる</button></nav><p id="status" role="status">プレビューを起動中</p></header>
<div id="stage"><iframe id="panel" title="QA Guide 解説のプレビュー" src="panel.html?preview=source"></iframe></div>
<script type="module">
const frame=document.querySelector('#panel'),status=document.querySelector('#status');

let ready=false,connectionTimer,generation=0;
function armTimeout(){clearTimeout(connectionTimer);connectionTimer=setTimeout(()=>{if(!ready)status.textContent='プレビューに接続できません。python3 start.pyで起動し、サンプルを再表示してください。'},8000)}
armTimeout();
function send(message){frame.contentWindow.postMessage(message,location.origin)}
async function show(){
 const current=generation;
 const response=await fetch('./sample-question.json?preview=source',{cache:'no-store'});
 if(!response.ok)throw new Error('サンプルを読み込めません。サンプルを再表示してください。');
 const question=await response.json();
 if(current!==generation)return false;
 send({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{content:[],structuredContent:{kind:'question',question,revision:1}}});
 return true;
}
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
 const m=event.data;if(!m||m.jsonrpc!=='2.0')return;
 const reply=result=>send({jsonrpc:'2.0',id:m.id,result});
 if(m.method==='ui/initialize')reply({protocolVersion:'2026-01-26',hostInfo:{name:'qa-preview-host',version:'0.1.0'},hostCapabilities:{},hostContext:{theme:'light',displayMode:'inline',availableDisplayModes:['inline']}});
 else if(m.method==='ui/notifications/initialized'){const current=generation;show().then(shown=>{if(!shown)return;clearTimeout(connectionTimer);ready=true;status.textContent='サンプル表示中 · 追加の解説はチャットで依頼してください'}).catch(e=>{if(current===generation){clearTimeout(connectionTimer);status.textContent=e.message}})}
 else if(m.id!==undefined)send({jsonrpc:'2.0',id:m.id,error:{code:-32601,message:'プレビューでは提供していない操作です'}});
});
for(const [id,width]of [['narrow','360px'],['wide','100%']])document.querySelector('#'+id).onclick=()=>{frame.style.width=width;for(const x of ['narrow','wide'])document.querySelector('#'+x).setAttribute('aria-pressed',String(x===id))};
document.querySelector('#reload').onclick=()=>{generation++;ready=false;armTimeout();frame.hidden=false;frame.src='panel.html?preview=source';document.querySelector('#toggle').textContent='パネルを閉じる';status.textContent='サンプルを再読込中'};
document.querySelector('#toggle').onclick=event=>{frame.hidden=!frame.hidden;event.target.textContent=frame.hidden?'パネルを開く':'パネルを閉じる'};
</script></html>
