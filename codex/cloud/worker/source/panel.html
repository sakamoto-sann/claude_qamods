<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>質問の補足</title><style>__CSS__</style></head><body><main>
<header><span class="brand">QA</span><div><h1>質問の補足</h1><p>回答はCodexの質問UI、またはチャットで。</p></div><span id="connection" role="status">接続中</span></header>
<button id="expand" hidden type="button">広げる</button>
<div id="empty">「詳しく」「??」と頼んだときに、質問の背景や選択肢の違いを表示します。</div>
<section id="question-view" hidden><p id="question-kind"></p><h2 id="question"></h2><p id="task" class="goal"></p><p id="background"></p>
<section id="options-section"><h3>選択肢の違い</h3><div id="options"></div></section>
<aside id="recommendation" class="recommendation"><h3>おすすめの理由</h3><p id="reason"></p></aside><div id="uncertainties"></div>
<details><summary>作業の背景</summary><section class="context"><h3>目的</h3><p id="goal"></p><p id="task-reference"></p><h3>現在状態</h3><p id="current-state"></p><h3>決める事項</h3><p id="decision"></p><h3>完了条件</h3><p id="completion"></p><h3>条件</h3><ul id="constraints"></ul><h3>最近の指示</h3><ul id="recent"></ul><h3>直前の説明</h3><p id="preceding"></p><h3>作業状況</h3><p id="work"></p></section></details>
<section class="context"><div class="actions"><button id="compact" disabled type="button">AI要約</button><button id="full" disabled type="button">全文脈で解説</button></div><p id="context-mode"></p><p id="full-status" role="status" aria-live="polite"></p><p id="explanation"></p></section>
<button id="dismiss" type="button">閉じる</button><footer>回答はCodexの質問UI、またはチャットで入力してください。</footer></section><p id="capability"></p><div id="error" role="alert"></div></main><script type="module">__SCRIPT__</script></body></html>
