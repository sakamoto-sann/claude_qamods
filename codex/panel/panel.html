<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>質問ガイド</title><link rel="stylesheet" href="/panel.css"><script type="module" src="/panel.js"></script></head><body>
<main><header><span class="brand">QA</span><div><h1>質問ガイド</h1><p>判断に必要なことを、この場所に。</p></div><span id="connection" role="status">接続中</span></header>
<div id="empty">質問が届くと、背景・選択後の結果・おすすめを表示します。</div>
<section id="question-view" hidden><div class="eyebrow">いま決めること</div><h2 id="question"></h2><p id="goal" class="goal"></p>
<section class="context"><h3>この質問の背景</h3><p id="background"></p><ul id="constraints"></ul><h3>最近の指示</h3><ul id="recent-instructions"></ul><h3>直前の説明</h3><p id="preceding-explanation"></p><h3>最新の作業状況</h3><p id="latest-work"></p></section>
<section class="context"><p id="context-mode">要点のみ</p><button id="full-context" type="button">全文脈で解説</button><p>この会話で参照できる範囲をCodexに再説明してもらいます。追加APIは呼びません。</p><p id="full-explanation"></p><p>トークン・料金：取得不可。チャット側の使用量はこのパネルへ提供されていません。</p></section>
<form id="answer-form"><fieldset><legend>選んだら、どうなる？</legend><div id="options"></div></fieldset>
<aside class="recommendation"><h3>おすすめの理由</h3><p id="reason"></p></aside><div id="uncertainties"></div>
<button id="submit" type="submit" disabled>この選択を回答する</button><p id="answer-status" role="status" aria-live="polite"></p></form>
<footer>選択だけでは回答されません。回答は実行承認の代用にはなりません。</footer></section><div id="error" role="alert"></div></main>
</body></html>
