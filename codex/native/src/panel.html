<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>質問の背景と選択肢</title><style>__CSS__</style></head><body><main>
<header><span class="brand">QA</span><div><h1>質問ガイド</h1><p>この会話での判断を手助けします。</p></div><span id="connection" role="status">接続中</span></header>
<div id="empty">この会話で質問を用意すると、背景・選択後の結果・おすすめを表示します。</div>
<section id="question-view" hidden><h2 id="question"></h2><p id="task" class="goal"></p><p id="taskReference"></p><section class="context"><h3>現在状態</h3><p id="current-state"></p><h3>決める事項</h3><p id="decision"></p><h3>完了条件</h3><p id="completion"></p></section><p id="goal" class="goal"></p>
<section class="context"><h3>背景</h3><p id="background"></p><ul id="constraints"></ul><h3>最近の指示</h3><ul id="recent"></ul><h3>直前の説明</h3><p id="preceding"></p><h3>作業状況</h3><p id="work"></p></section>
<section id="answer-form"><fieldset><legend>選んだら、どうなる？</legend><div id="options"></div></fieldset><aside class="recommendation"><h3>おすすめの理由</h3><p id="reason"></p></aside><div id="uncertainties"></div><button id="submit" disabled type="button">この選択をこの会話へ回答する</button></section>
<section class="context"><button id="full" disabled type="button">全文脈で解説</button><p id="full-status"></p><p id="explanation"></p><p>トークン・料金：取得不可</p></section><p id="answer-status" role="status" aria-live="polite"></p><footer>選択だけでは送信されません。回答は実行承認の代用にはなりません。</footer></section><p id="capability"></p><div id="error" role="alert"></div></main><script type="module">__SCRIPT__</script></body></html>
